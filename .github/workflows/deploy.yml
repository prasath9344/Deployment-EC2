name: Deploy Node App to AWS EC2

on:
  push:
    branches:
      - main   # Trigger deployment when you push to main branch
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Build app (if needed)
        run: |
          echo "No build step defined, skipping..."
          # if you have React/Vite etc add: npm run build

      - name: Copy project files to EC2
        uses: appleboy/scp-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "."
          target: "/home/${{ secrets.EC2_USERNAME }}/app"

      - name: SSH into EC2 and Deploy with Docker
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Update system and install Docker if missing
            sudo apt-get update -y
            if ! command -v docker &> /dev/null
            then
              echo "Installing Docker..."
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            cd ~/app

            # Stop and remove old container if running
            if [ "$(sudo docker ps -q -f name=nodeapp)" ]; then
              echo "Stopping existing container..."
              sudo docker stop nodeapp
              sudo docker rm nodeapp
            fi

            # Build Docker image
            sudo docker build -t nodeapp .

            # Run new container on port 3000
            sudo docker run -d -p 3000:3000 --name nodeapp nodeapp

            echo "Deployment complete! App running on port 3000."
