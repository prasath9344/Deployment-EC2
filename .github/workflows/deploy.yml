name: Deploy Dockerized Node App to AWS EC2

on:
  push:
    branches:
      - main  # Runs on push to main branch
  workflow_dispatch:  # Allow manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🔍 Test SSH connectivity before copying files
      - name: Test SSH connectivity
        run: |
          echo "${{ secrets.EC2_KEY }}" > private.pem
          chmod 600 private.pem
          ssh -o StrictHostKeyChecking=no -i private.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} "echo ✅ SSH connected successfully!"

      # 📦 Copy project files to EC2
      - name: Copy project files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "."
          target: "/home/${{ secrets.EC2_USERNAME }}/app"

      # 🚀 SSH into EC2 and deploy Docker container
      - name: SSH into EC2 and deploy Docker container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            echo "🚀 Starting deployment on EC2..."

            # Update and install Docker if needed
            sudo apt-get update -y
            if ! command -v docker &> /dev/null; then
              echo "🛠 Installing Docker..."
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            # Navigate to project directory
            cd /home/${{ secrets.EC2_USERNAME }}/app

            echo "🧹 Cleaning old containers..."
            if [ "$(sudo docker ps -q -f name=nodeapp)" ]; then
              sudo docker stop nodeapp
              sudo docker rm nodeapp
            fi
            if [ "$(sudo docker images -q nodeapp)" ]; then
              sudo docker rmi -f nodeapp
            fi

            echo "🐳 Building new Docker image..."
            sudo docker build -t nodeapp .

            echo "🚢 Running new container..."
            sudo docker run -d -p 3000:3000 --name nodeapp nodeapp

            echo "✅ Deployment complete! Node app running on port 3000."
