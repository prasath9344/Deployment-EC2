name: Deploy Node App to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Copy project files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          source: "app/*"
          target: "/home/${{ secrets.EC2_USERNAME }}/app"

      - name: SSH into EC2 and Deploy with Docker
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            sudo apt-get update -y
            if ! command -v docker &> /dev/null
            then
              echo "Installing Docker..."
              sudo apt-get install -y docker.io
              sudo systemctl start docker
              sudo systemctl enable docker
            fi

            cd ~/app

            if [ "$(sudo docker ps -q -f name=nodeapp)" ]; then
              sudo docker stop nodeapp
              sudo docker rm nodeapp
            fi

            sudo docker build -t nodeapp .
            sudo docker run -d -p 3000:3000 --name nodeapp nodeapp

            echo "✅ Deployment complete! App running on port 3000."
